name: Latest-deps canary

# BACK-1327: the main matrix pins nothing and the compat matrix pins only two
# tree-sitter-language-pack versions, so a breaking upstream release is
# invisible until a user hits it (BACK-574). This runs the suite weekly against
# the newest release of every dependency, allowed by pyproject.toml's own
# bounds (the tree-sitter<0.26 ceiling, BACK-1161, still applies).
#
# Not a merge gate: a red run means "look at upstream", not "block a PR".

on:
  schedule:
    - cron: '17 6 * * 1'  # Mondays 06:17 UTC
  workflow_dispatch:

jobs:
  latest-deps:
    name: Latest deps (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (newest allowed)
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade --upgrade-strategy eager -e ".[dev]"
          pip install build  # tests/test_packaging_manifest.py shells out to `python -m build`
          pip list

      - name: Run tests
        env:
          PYTHONIOENCODING: utf-8
        run: pytest tests/
