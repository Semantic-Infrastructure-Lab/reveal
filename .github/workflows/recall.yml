name: Pinned C recall

# Optional source-only validation. Redis/curl are never services or runtime dependencies.
on:
  schedule:
    - cron: '41 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c-pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REVEAL_MAX_WORKERS: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Point corpus and cache at the runner temp directory
        # The runner context is not available in job-level env, which made this whole
        # workflow invalid (every push failed at 0s with "workflow file issue").
        run: |
          echo "REVEAL_CORPUS_DIR=$RUNNER_TEMP/reveal-corpus" >> "$GITHUB_ENV"
          echo "REVEAL_CACHE_DIR=$RUNNER_TEMP/reveal-cache" >> "$GITHUB_ENV"
      - name: Install validation environment
        run: |
          python -m pip install -e '.[dev]' 'tree-sitter==0.25.2' 'tree-sitter-language-pack==1.21.0'
          gcc --version
      - name: Check measurement controls
        run: pytest tests/test_recall_gate.py tests/test_fetch_corpus.py -q
      - name: Fetch pinned C source pair
        run: python scripts/fetch_corpus.py c
      - name: Compare with reviewed baseline
        run: python scripts/recall_gate.py --corpus-root "$REVEAL_CORPUS_DIR" --output recall-report.json
      - name: Preserve report including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: c-recall-report
          path: recall-report.json
          if-no-files-found: warn
