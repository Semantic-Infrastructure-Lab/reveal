name: Pinned corpus recall

# Optional source-only validation: independent import and Python caller oracles (GCC for C/C++, Python's ast,
# Rust/Java resolution rules, Go toolchain, TypeScript compiler) vs imports://?importers on the manifest's pinned recall corpora. The corpora
# are never services or runtime dependencies.
on:
  schedule:
    - cron: '41 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recall:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REVEAL_MAX_WORKERS: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.14.0'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.21.5'
          cache: false
      - name: Install independent compiler oracle
        run: npm ci --prefix scripts/oracles --ignore-scripts --no-audit --no-fund
      - name: Point corpus and cache at the runner temp directory
        # The runner context is not available in job-level env, which made this whole
        # workflow invalid (every push failed at 0s with "workflow file issue").
        run: |
          echo "REVEAL_CORPUS_DIR=$RUNNER_TEMP/reveal-corpus" >> "$GITHUB_ENV"
          echo "REVEAL_CACHE_DIR=$RUNNER_TEMP/reveal-cache" >> "$GITHUB_ENV"
      - name: Install validation environment
        # The pack is pinned for reproducible rows, and the pin follows the version a fresh install and
        # the maintainer gate venv get: on 1.21.0 the Kotlin grammar recovers 13 tivi files partially and
        # loses 2 of 1,631 import edges that 1.23.1 parses cleanly (BACK-2503). Move the pin and the
        # baselines together (scripts/recall_gate.py --write-baseline after review).
        run: |
          python -m pip install -e '.[dev]' 'tree-sitter==0.25.2' 'tree-sitter-language-pack==1.23.1'
          gcc --version
      - name: Check measurement controls
        run: pytest tests/test_recall_gate.py tests/test_fetch_corpus.py tests/test_framework_matrix.py -q -rs
      - name: Fetch pinned recall corpora
        # Budget (2026-10-06, 8 corpora): cold fetch 506 s / 1.7 GB on a home link, measuring ~70 s.
        run: python scripts/fetch_corpus.py --recall
      - name: Compare imports with reviewed baseline
        run: python scripts/recall_gate.py --corpus-root "$REVEAL_CORPUS_DIR" --output recall-report.json
      - name: Compare Python callers with reviewed baseline
        if: ${{ !cancelled() }}
        run: python scripts/recall_gate.py --signal calls --corpus-root "$REVEAL_CORPUS_DIR" --output calls-report.json
      - name: Preserve reports including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recall-report
          path: |
            recall-report.json
            calls-report.json
          if-no-files-found: warn
