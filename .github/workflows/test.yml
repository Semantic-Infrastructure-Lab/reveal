name: Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_call:  # Allow this workflow to be called by other workflows

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # A hung leg (BACK-1475: a compat-matrix run sat silent for ~50 min) otherwise runs to GitHub's 6 h
    # default. The slowest leg takes ~13 min.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.12', '3.14']
        include:
          # BACK-1357: ubuntu-latest becomes Ubuntu 26.04 from 2026-10-19
          # (actions/runner-images#14748). Test it ahead of the switch; the
          # ubuntu-latest-only steps below stay on the 24.04 leg.
          - os: ubuntu-26.04
            python-version: '3.12'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install build  # Required for packaging manifest tests

      - name: Run tests
        env:
          PYTHONIOENCODING: utf-8
          # Makes reveal/ text I/O without encoding= fail its test (pyproject filterwarnings).
          # Console output under a non-UTF-8 stream: tests/test_console_encoding.py.
          PYTHONWARNDEFAULTENCODING: '1'
        run: pytest tests/

      - name: Test Windows compatibility checks
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python scripts/check_windows_compat.py

      - name: Text-encoding ratchet (Windows cp1252 guard)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python scripts/check_text_encoding.py

      - name: Tree-sitter accessor guard (bare node.start_byte breaks language-pack 1.8.1)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python scripts/check_treesitter_accessors.py

      - name: Shared-seam ratchet (walkers, tree-sitter imports, exit, print)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python scripts/check_boundaries.py

      - name: Complexity ratchet (a function over the C901 threshold may only get simpler)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python scripts/check_complexity.py

      - name: Doc hygiene ratchet (broken links, internal-docs refs)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python scripts/check_doc_hygiene.py --baseline .github/doc_hygiene_baseline.txt

      - name: Lint workflow files (an invalid one fails at 0s on every push, BACK-1675)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          python -m pip install 'actionlint-py==1.7.12.25'
          actionlint .github/workflows/*.yml

      - name: Test CLI basics
        shell: bash
        run: |
          reveal --version
          reveal --list-supported

      - name: Reveal self-validation (dogfooding)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        shell: bash
        run: |
          reveal reveal:// --check

      - name: B006 silent-exception-handler regression gate (dogfooding)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        shell: bash
        run: |
          # BACK-988: B006 catches the exact bug shape behind BACK-979/981/982/
          # 984/985/990/991 (an except-Exception handler with no visible failure
          # signal, rendering a crash as a clean empty result). Nothing previously
          # ran it in CI, so this class of bug could silently regress. Not all
          # current hits are triaged yet (BACK-989), so this is a ratchet against
          # a tracked baseline, not a zero-issues gate.
          BASELINE=$(cat .github/b006_baseline.txt)
          # `reveal check` exits 1 whenever it finds any issues -- expected
          # here, since the baseline is a nonzero count by design (BACK-989
          # tracks triaging it down to 0). Under bash's default `-e -o
          # pipefail` for `shell: bash` steps, piping that nonzero exit
          # straight into python3 killed this step before the baseline
          # comparison ever ran, regardless of whether the count actually
          # regressed -- silently broken since this gate was added (BACK-988)
          # because the 24-commit batch push that introduced it only
          # triggered CI on the final SHA, never validating it. `|| true`
          # discards reveal check's own exit code while still letting
          # pipefail catch a genuine failure in the python3 parse step.
          COUNT=$( (reveal check reveal --select=B006 --format=json 2>/dev/null || true) | python3 -c "import json,sys; print(json.load(sys.stdin)['summary']['total_issues'])")
          echo "B006 issues: $COUNT (baseline: $BASELINE)"
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "❌ B006 issue count increased ($BASELINE -> $COUNT) — a new silent broad-exception handler was introduced."
            echo "   See internal-docs/case-studies/bugs-2026-08-06-silent-exception-swallowing-audit.md."
            exit 1
          elif [ "$COUNT" -lt "$BASELINE" ]; then
            echo "✅ B006 count decreased ($BASELINE -> $COUNT) — update .github/b006_baseline.txt to $COUNT to lock in the improvement."
          fi

  compat-matrix:
    # BACK-1125: forced-dependency-version + Python-version-boundary visibility
    # job. This is the gap that let BACK-574 (a tree-sitter-language-pack bump
    # silently flipping accessor method->property semantics, swallowed by a
    # broad except Exception) reach production undetected -- the main `test`
    # job above never installs a forced third-party version, so nothing here
    # caught it before a live user did. Promoted to a real merge gate
    # (continue-on-error: false) once BACK-1161's requires-python<3.14 cap
    # lifted and both matrix legs (lp 1.12.5 and 1.14.3) verified clean on
    # Python 3.14 -- 12,138 passed / 0 failed each, locally reproduced ahead
    # of this flip.
    name: Compat matrix (Python ${{ matrix.python-version }}, tree-sitter-language-pack ${{ matrix.lp-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
        lp-version: ['1.12.5', '1.14.3']  # 1.12.5: first post-vendored-parser release; 1.14.3: current upstream
        include:
          # BACK-1327: pyproject.toml declares tree-sitter-language-pack>=1.8.1;
          # test that floor so the declaration cannot silently rot. Full suite
          # verified green at 1.8.1 locally (2026-09-21).
          - python-version: '3.12'
            lp-version: '1.8.1'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (forcing tree-sitter-language-pack==${{ matrix.lp-version }})
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "tree-sitter-language-pack==${{ matrix.lp-version }}"
          pip install build  # tests/test_packaging_manifest.py shells out to `python -m build`

      - name: Pre-download every tree-sitter grammar (BACK-1476)
        # 1.8.1 fetches a grammar into the shared cache on first get_parser(). Two xdist workers
        # doing that for the same language at once crashed with SIGBUS (one dlopen()s the shared
        # object while the other is still writing it). Fetching up front, single-process, leaves
        # the workers read-only. Newer packs did not show it, so only the floor leg pays the
        # download.
        if: matrix.lp-version == '1.8.1'
        run: python -c "from reveal.core import treesitter_parse; print('grammars fetched:', treesitter_parse.download_all())"

      - name: Run tests
        env:
          PYTHONIOENCODING: utf-8
        run: pytest tests/

