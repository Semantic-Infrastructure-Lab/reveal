name: Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_call:  # Allow this workflow to be called by other workflows

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install build  # Required for packaging manifest tests

      - name: Run tests
        env:
          PYTHONIOENCODING: utf-8
        run: pytest tests/

      - name: Test Windows compatibility checks
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          if [ -f scripts/check_windows_compat.py ]; then
            python scripts/check_windows_compat.py --warn
          fi

      - name: Test CLI basics
        shell: bash
        run: |
          reveal --version
          reveal --list-supported

      - name: Reveal self-validation (dogfooding)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        shell: bash
        run: |
          python3 << 'EOF'
          from reveal.adapters.reveal import RevealAdapter
          from reveal.rules import RuleRegistry

          # Run reveal:// self-validation
          adapter = RevealAdapter()
          structure = adapter.get_structure()
          detections = RuleRegistry.check_file(
              file_path='reveal://',
              structure=structure,
              content='',
              select=['V']  # Only validation rules
          )

          if detections:
              print('❌ Reveal self-validation failed:')
              for d in detections:
                  print(f'  [{d.severity.value.upper()}] {d.rule_code}: {d.message}')
              exit(1)

          print('✅ Reveal self-validation passed (all V001-V006 checks)')
          EOF

      - name: B006 silent-exception-handler regression gate (dogfooding)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        shell: bash
        run: |
          # BACK-988: B006 catches the exact bug shape behind BACK-979/981/982/
          # 984/985/990/991 (an except-Exception handler with no visible failure
          # signal, rendering a crash as a clean empty result). Nothing previously
          # ran it in CI, so this class of bug could silently regress. Not all
          # current hits are triaged yet (BACK-989), so this is a ratchet against
          # a tracked baseline, not a zero-issues gate.
          BASELINE=$(cat .github/b006_baseline.txt)
          # `reveal check` exits 1 whenever it finds any issues -- expected
          # here, since the baseline is a nonzero count by design (BACK-989
          # tracks triaging it down to 0). Under bash's default `-e -o
          # pipefail` for `shell: bash` steps, piping that nonzero exit
          # straight into python3 killed this step before the baseline
          # comparison ever ran, regardless of whether the count actually
          # regressed -- silently broken since this gate was added (BACK-988)
          # because the 24-commit batch push that introduced it only
          # triggered CI on the final SHA, never validating it. `|| true`
          # discards reveal check's own exit code while still letting
          # pipefail catch a genuine failure in the python3 parse step.
          COUNT=$( (reveal check reveal --select=B006 --format=json 2>/dev/null || true) | python3 -c "import json,sys; print(json.load(sys.stdin)['summary']['total_issues'])")
          echo "B006 issues: $COUNT (baseline: $BASELINE)"
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "❌ B006 issue count increased ($BASELINE -> $COUNT) — a new silent broad-exception handler was introduced."
            echo "   See internal-docs/case-studies/bugs-2026-08-06-silent-exception-swallowing-audit.md."
            exit 1
          elif [ "$COUNT" -lt "$BASELINE" ]; then
            echo "✅ B006 count decreased ($BASELINE -> $COUNT) — update .github/b006_baseline.txt to $COUNT to lock in the improvement."
          fi

