# Metrics Adapter Help Data (metrics:// before BACK-2069; metrics:// and classify:// are retired spellings)
# Extracted from stats.py::get_help() to reduce function complexity

name: metrics
description: 'Analyze codebase metrics, identify file hotspots, assess code quality, and tag every file''s provenance'
syntax: 'reveal metrics <path> [--view VIEW] [--where EXPR]... [--limit N]'

examples:
  - uri: 'reveal metrics src/'
    description: 'Get overview statistics for src directory'
  - uri: 'metrics://./src?view=hotspots'
    description: 'The 10 files most in need of attention: the ranked hotspot files are the rows (reveal metrics ./src --view hotspots)'
  - uri: 'metrics://./src?view=hotspots&limit=0'
    description: 'Every ranked hotspot file (limit=0 is uncapped)'
  - uri: 'metrics://./src/app.py'
    description: 'Get detailed statistics for a specific file'
  - uri: 'metrics://./src?where=lines>=50'
    description: 'Filter files with 50+ lines (reveal metrics ./src --where ''lines>=50'')'
  - uri: 'metrics://./src?lines>50'
    description: 'The same filter as a bare query key: files with more than 50 lines'
  - uri: 'metrics://./src?avg_complexity<=10'
    description: 'Show files with average complexity <= 10 (avg_complexity is the file average)'
  - uri: 'metrics://./src?complexity<10'
    description: 'complexity is an alias of avg_complexity'
  - uri: 'metrics://./src?lines=50..200'
    description: 'Filter files with 50-200 lines (range)'
  - uri: 'metrics://./src?functions!=0'
    description: 'Show only files with functions (not equals)'
  - uri: 'metrics://./src?complexity>10&sort=-lines'
    description: 'Complex files sorted by size (descending)'
  - uri: 'metrics://./src?sort=complexity&limit=10'
    description: 'Top 10 files by complexity (ascending)'
  - uri: 'metrics://./src?lines>100&sort=-complexity&limit=5'
    description: 'Top 5 most complex large files'
  - uri: 'metrics://./src --format=json'
    description: 'JSON output for CI/CD integration'
  - uri: 'metrics://./src?view=provenance'
    description: 'Provenance (first_party/test/vendor/minified) of every analyzable file, no analysis or rules (was classify://)'

features:
  - 'Aggregate codebase metrics (lines, functions, classes, complexity)'
  - 'Hotspot identification (largest/most complex files)'
  - 'Per-file statistics with quality scoring'
  - 'Advanced filtering with operators (>, <, >=, <=, ==, !=, ~=, ..)'
  - 'Result control (sort, limit, offset) for pagination'
  - 'Multi-language support (Python, JS, Go, Rust, etc.)'
  - 'CI/CD friendly JSON output'
  - 'view=provenance: the full-population provenance report (summary.total, by_provenance, excluded, excluded_by_extension) that classify:// gave'

operators:
  '>': 'Greater than (e.g., lines>50)'
  '<': 'Less than (e.g., complexity<10)'
  '>=': 'Greater than or equal (e.g., functions>=5)'
  '<=': 'Less than or equal (e.g., complexity<=15)'
  '==': 'Equals (e.g., classes==0)'
  '!=': 'Not equals (e.g., functions!=0)'
  '~=': 'Regex match (e.g., file~=test)'
  '..': 'Range (e.g., lines=50..200, complexity=5..15)'

fields:
  lines: 'Total line count (maps to lines.total)'
  code_lines: 'Code line count (maps to lines.code)'
  comment_lines: 'Comment line count (maps to lines.comments)'
  avg_complexity: 'Average complexity of the file (maps to complexity.average)'
  complexity: 'Alias of avg_complexity'
  max_complexity: 'The most complex function (maps to complexity.max)'
  functions: 'Function count (maps to elements.functions)'
  classes: 'Class count (maps to elements.classes)'
  quality: 'Quality score (maps to quality.score)'

result_control:
  sort: 'Sort the files by field ascending (e.g., sort=lines)'
  sort_descending: 'Sort the files by field descending (e.g., sort=-lines)'
  limit: 'Keep at most N rows: files, or the ranked files of view=hotspots (default 10 there); 0 = no cap'
  offset: 'Skip the first N rows (e.g., offset=5)'

filters:
  view: 'view=hotspots: the ranked hotspot files are the rows (--view hotspots); view=provenance: every file''s provenance tag'
  where: 'FIELD OP VALUE, repeatable (--where ''lines>50''); a bare query key with an operator is the same filter'
  code-only: 'Leave data/config files out of the walk (--code-only; code_only is its alias)'
  churn: 'on|off: fold commit-touch counts into the hotspot score (--churn off)'
  merges: 'on|off: count merge commits in the churn tally (--merges off)'
  since: 'Bound the churn walk to commits on/after a date, from its start: today, YYYY[-MM[-DD]] or a time'
  tests: 'In view=hotspots, include (default) or exclude test/support files selected by conventional names plus project test_layout.additional_paths; changes only the ranking, preserving totals'
  detail: 'normal (per-file rows) or summary (the aggregate only: --detail summary)'
  hotspots: 'Replaced by view=hotspots (hotspots=true still answers files plus the ranking, with a note)'
  top: 'Replaced by limit in view=hotspots (with legacy hotspots=true it caps the ranking, with a note)'
  min_lines: 'Replaced by where lines>=N (still answers, with a note)'
  max_lines: 'Replaced by where lines<=N (still answers, with a note)'
  min_functions: 'Replaced by where functions>=N (still answers, with a note)'
  min_complexity: 'Replaced by where avg_complexity>=N, the file average (still answers, with a note)'
  max_complexity: 'Replaced by where avg_complexity<=N, the file average (still answers, with a note)'
  summary_only: 'Replaced by detail=summary (still answers, with a note)'
  no_churn: 'Replaced by churn=off (--no-churn by --churn off; still answers, with a note)'
  no_merges: 'Replaced by merges=off (still answers, with a note)'

workflows:
  - name: 'Find Refactoring Targets'
    scenario: 'Need to identify code that needs cleanup'
    steps:
      - 'metrics://./src?view=hotspots              # See worst files'
      - 'metrics://./src?avg_complexity>=15      # High complexity files'
      - 'reveal <hotspot-file> --check        # Analyze specific issues'
  - name: 'CI/CD Findings Gate'
    scenario: 'Fail the build on a file below quality 70 or a function above complexity 20'
    steps:
      - 'reveal metrics ./src --view hotspots --fail-on findings   # exit 1 when summary.has_findings is true'
  - name: 'CI/CD Quality Trend'
    scenario: 'Fail build if complexity increases'
    steps:
      - 'metrics://./src --format=json > before.json'
      - '# Make changes...'
      - 'metrics://./src --format=json > after.json'
      - 'jq -r ".summary.avg_complexity" before.json after.json  # Compare'
  - name: 'Architecture Assessment'
    scenario: 'Understand codebase structure and size'
    steps:
      - 'metrics://./src                        # Overall metrics'
      - 'metrics://./src/core                   # Core subsystem'
      - 'metrics://./src/plugins                # Plugins subsystem'
      - '# Compare metrics to identify imbalanced architecture'

anti_patterns:
  - bad: 'find . -name "*.py" | xargs wc -l'
    good: 'metrics://.'
    why: 'Provides context (functions, classes, complexity), not just line counts'
  - bad: 'grep -r "def " | wc -l'
    good: 'metrics://. --format=json | jq .summary.total_functions'
    why: 'Accurate parsing with structured output, not text munging'

notes:
  - 'Recursively analyzes all supported file types in directory'
  - 'Complexity calculated using cyclomatic complexity heuristic'
  - 'Hotspots ranked by: long functions, deep nesting, high complexity'
  - 'Use --view hotspots to see the 10 worst files (limit=N for more, 0 for all)'
  - 'Quality score: 0-100 (higher is better)'
  - 'New unified query syntax supports operators: >, <, >=, <=, ==, !=, ~=, ..'
  - 'Result control (sort, limit, offset) enables pagination and ordering'
  - 'The legacy thresholds (replaced by where) still answer, with a replaced-by note'
  - 'where takes the operator filters on both spellings: --where ''lines>50'' and ?where=lines>50 (or the bare key ?lines>50)'
  - 'view=hotspots ranks the whole filtered population; limit and offset page the ranked rows'
  - 'Explicit tests=include|exclude reports test_scope with the selected policy basis, anchor/source and ranking-only files_excluded. Ordinary overview does not request this ranking'
  - 'Exit codes: 0 complete, 1 with view=hotspots and --fail-on findings when summary.has_findings is true, 2 rejected request, 3 files lost or not analyzed (analysis_failed, parse_recovered, check_rules_failed, an unreadable directory)'
  - 'view=hotspots adds summary.has_findings: some analysed file has quality below 70 or a function with complexity above 20 (fixed thresholds). It is taken over every analysed file, before where, tests= and the limit/offset cuts. --fail-on findings (default none) exits 1 on it; the other views have no findings and exit 2 under it'
  - 'Combine filters and result control: ?lines>100&sort=-complexity&limit=10'
  - 'stats:// and classify:// are retired spellings: they answer the same as metrics:// and metrics://?view=provenance and print a replaced-by note'

output_formats:
  - text
  - json

see_also:
  - 'reveal metrics <path> - CLI subcommand form (the same answer; --view hotspots, --view provenance, --where ''lines>=N'', --sort=-lines --limit N)'
  - 'reveal help://ast - Query code structure'
  - 'reveal --check - Run quality checks'
  - 'reveal help://tricks - Power user workflows'
