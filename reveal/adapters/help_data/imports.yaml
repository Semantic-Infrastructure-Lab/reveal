# Imports Adapter Help Data
# Import graph analysis for detecting unused imports, circular dependencies, and layer violations

name: imports
description: 'Import graph analysis for detecting unused imports, circular dependencies, layer violations, and fan-in ranking'
syntax: 'imports://<path>[?<query>]'

examples:
  # Basic import inspection
  - uri: "imports://src"
    description: 'List all imports in src directory with import graph'

  - uri: "imports://src/main.py"
    description: 'Show imports for single file'

  # Quality checks
  - uri: "imports://src?unused"
    description: 'Find unused imports (imports that are never referenced in code)'

  - uri: "imports://src?circular"
    description: 'Detect circular dependencies (module A imports B, B imports A)'

  - uri: "imports://src?violations"
    description: 'Check layer violations based on .reveal.yaml architecture rules'

  # Architectural analysis
  - uri: "imports://src?rank=fan-in"
    description: 'Rank files by fan-in — how many files import each file (high = core abstraction; zero = entry point or dead code)'

  - uri: "imports://src?rank=fan-in&top=10"
    description: 'Top 10 most-imported files — find the load-bearing modules before refactoring'

  - uri: "imports://src?entrypoints"
    description: 'List files nothing imports (fan-in=0) — entry points, CLIs, scripts, or dead code; sorted by fan-out'

  - uri: "imports://src?components"
    description: 'Score each directory as a component — cohesion (how self-contained; n/a for Go, Java, Kotlin, C#, Scala and Swift directories, where files share a package without importing), coupling (incoming/outgoing), top bridge file'

  # Which edges count (function-level imports)
  - uri: "imports://src?rank=fan-in&lazy=exclude"
    description: 'Load-time (module-level) imports only — the architecture view; the default counts function-level imports too'

  - uri: "imports://src?circular&lazy=include"
    description: 'Count function-level (lazy) imports as cycle edges too; ?circular leaves them out by default'

  # Who imports what (the depends:// answers, BACK-1054)
  - uri: "imports://src/utils.py?importers"
    description: 'Who imports utils.py, from anywhere under the project root: each import line, its scope and the cascade stage that resolved it'

  - uri: "imports://src?importers&tests=exclude"
    description: 'Every module under src with its sorted importers, importers under a test path not counted'

  - uri: "imports://src?rank=fan-in&scope=path"
    description: 'Resolve at src itself instead of the project root (the requested path is the scan root)'

  # Verbose output
  - uri: "imports://src --verbose"
    description: 'Show detailed import information including file paths and line numbers'

  # JSON output for tooling
  - uri: "imports://src?unused --format json"
    description: 'Machine-readable output for CI/CD integration'

elements:
  unused: 'Imports that are never used in the code'
  circular: 'Circular dependency chains between modules'
  violations: 'Architecture layer violations (requires .reveal.yaml config)'
  lazy: 'Which function-level import edges count: include, exclude (load-time only) or only'
  importers: 'Who imports a file (=FILE or a file path), or every module under a directory with its importers'
  scope: 'root (default): resolve at the project root, rows under the path; path: the path is the scan root'
  tests: 'include (default) or exclude project-relative test importers; checkout ancestors and project name do not count. Markerless scan-root fallback is disclosed'
  root: 'Pin the scan root to DIR (must contain the path)'
  max_files: 'Source files the walk may keep (default 20000), disclosed when it cuts'

flags:
  --verbose: 'Show detailed import information (file paths, line numbers, full chains)'
  --format: 'Output format (text, json)'

features:
  - 'Import graph construction for Python, JavaScript, TypeScript, and more'
  - 'Unused import detection (dead code cleanup)'
  - 'Circular dependency detection (refactoring opportunity identification)'
  - 'Layer violation checking for clean architecture enforcement'
  - 'Fan-in ranking — surface core abstractions and entry points from import structure alone'
  - 'Multi-language support (Python, JS/TS, Go, Rust, Java, C++, etc.)'
  - 'JSON output for CI/CD integration and tooling'
  - 'Progressive disclosure (summary → detail → violations)'
  - "Per-import 'classification' field (intra_project/stdlib/unresolved/unknown, BACK-1190) — resolution truth first (BACK-1193), stdlib only where a language-appropriate list exists"

workflows:
  - name: 'Architectural Orientation (fan-in ranking)'
    scenario: 'Understand a new codebase — find core abstractions and entry points before reading code'
    steps:
      - "reveal 'imports://src?rank=fan-in&top=20'"
      - 'High fan-in files (top rows) = core abstractions — changes here ripple everywhere'
      - 'Zero fan-in files (bottom) = entry points or dead code — safe starting points'
      - "reveal src/core_module.py  # drill into the highest fan-in file"

  - name: 'Clean Up Unused Imports'
    scenario: 'Remove dead code and improve maintainability'
    steps:
      - 'reveal imports://src?unused'
      - 'Review unused imports list'
      - 'Remove unused imports from files'
      - "Verify with reveal 'imports://src?unused' again"

  - name: 'Detect Circular Dependencies'
    scenario: 'Find and break circular import cycles'
    steps:
      - "reveal 'imports://src?circular'"
      - 'Identify circular chains (A → B → A)'
      - 'Refactor to break cycles (extract common interface, use dependency injection)'
      - 'Verify with imports:// again'

  - name: 'Enforce Architecture Layers'
    scenario: 'Ensure clean architecture with layer boundaries'
    steps:
      - 'Create .reveal.yaml with layer rules'
      - "reveal 'imports://src?violations'"
      - 'Fix violations (move files or refactor dependencies)'
      - "Add to CI/CD: reveal 'imports://src?violations' --format json"

  - name: 'Codebase Health Check'
    scenario: 'Comprehensive import analysis'
    steps:
      - 'reveal imports://src'
      - "reveal 'imports://src?unused'"
      - "reveal 'imports://src?circular'"
      - "reveal 'imports://src?rank=fan-in&top=10'"
      - 'Address issues found in each check'

anti_patterns:
  - bad: 'reveal imports:// src'
    good: 'reveal imports://src'
    why: 'Path must be part of URI scheme, not separate argument'

  - bad: "reveal imports://src?unused | grep 'module_name'"
    good: 'reveal imports://src/module_name.py?unused'
    why: 'Filter at source for faster results and cleaner output'

  - bad: 'Manually scanning for unused imports in large codebases'
    good: "reveal imports://src?unused --format json | jq '.unused[] | .file'"
    why: 'Automated detection is faster, more accurate, and scriptable'

try_now:
  - 'reveal imports://reveal'
  - "reveal 'imports://reveal?unused'"
  - "reveal 'imports://reveal?circular'"
  - "reveal 'imports://reveal?rank=fan-in&top=15'"

notes:
  - 'Unused import detection requires parsing file content to check references'
  - 'Circular dependency detection builds full import graph'
  - 'Layer violations require .reveal.yaml configuration file'
  - "Function-level (lazy) imports are edges: ?circular and has_cycles leave them out (a lazy back-edge is no import-time cycle), every other view counts them; &lazy=include|exclude|only overrides. Every answer prints its rule (Rule: line, edge_rule in JSON). Python, JavaScript, TypeScript and TSX record import scope; the rule names other languages' unclassified edges"
  - "Every answer resolves at the project root (&root=, .reveal.yaml root: true, package marker, VCS root, else the requested directory) through depends://'s cascade (direct, PHP constants, namespaces, members, Swift modules, Zeitwerk naming) and shows rows under the requested path; &scope=path makes the path itself the scan root. The rule names the root and its source, &scope, &tests, the edges each stage found (via) and the languages no recall oracle gates. Swift module and Zeitwerk convention edges never close a cycle"
  - "Paths are relative to the requested directory (a file target's own directory); a file outside it, a target outside a pinned &root= or a &scope=path root included, is spelled ../ (metadata.files_failed too), never as a host path"
  - "?components cohesion is declined (null in JSON, n/a in text, a cohesion_reason on the row and one cohesion_rule line) for a component with more than half its files in Go, Java, Kotlin, C#, Scala or Swift: files of one package or module use each other without an import, so internal imports would read ~0. Declined components sort after measured ones; other languages keep their number"
  - 'Static imports only — dynamic dispatch (importlib.import_module, JS require(), Java Class.forName, Ruby autoload, plugin registries, etc.) is not captured by any query mode; affected files show lower fan-in than actual and may appear as false-positive entrypoints'
  - 'Supported languages: Python, JavaScript, TypeScript, Go, Rust, Java, C++, and more'
  - 'Use --verbose for detailed import chains and file paths'

see_also:
  - 'reveal help://ast - Query code structure by complexity'
  - 'reveal help://calls - Function-level call graph'
  - 'reveal help://metrics - Codebase metrics and hotspots'
  - 'reveal help://configuration - Layer violation config (.reveal.yaml)'
  - 'reveal file.py --check --select I - Import quality rules (every I rule: reveal --rules)'

output_formats:
  - text
  - json
