    license: AGPLv3/SSPLv1/RSALv2 (post-2024 relicense) — restrictive, do not extract
    role: Real application (database server), dense idiomatic C
    recall:
      oracle: gcc-c
      importer_dirs: [src, modules, tests/modules, utils]
      include_dirs: [src, src/commands, deps/hiredis, deps/lua/src, deps/xxhash,
                     deps/hdr_histogram, deps/jemalloc/include, deps/fpconv,
                     deps/linenoise, deps/tre/lib, .]
